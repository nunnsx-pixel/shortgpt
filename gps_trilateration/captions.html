<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Legendas (overlay transparente)</title>
<style>
  @font-face { font-family: 'Montserrat'; font-weight: 700; src: url('node_modules/@fontsource/montserrat/files/montserrat-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 800; src: url('node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2') format('woff2'); }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  /* identical to index.html: just below the vertical centre, clear of the TikTok/Shorts UI rails */
  #captions {
    position: absolute; left: 60px; width: 960px; top: 1030px; text-align: center;
    font-family: 'Montserrat', 'DejaVu Sans', sans-serif; font-weight: 800; font-size: 62px; line-height: 1.16;
    color: #fff; letter-spacing: -0.5px; pointer-events: none;
  }
  #captions .w {
    display: inline-block; margin: 0 0.13em; opacity: 0; will-change: transform;
    -webkit-text-stroke: 12px rgba(0,0,0,0.96); paint-order: stroke fill; stroke-linejoin: round;
    text-shadow: 0 6px 22px rgba(0,0,0,0.75);
  }
  #captions .w.red  { color: #ff2a55; }
  #captions .w.cyan { color: #00f0ff; }
</style>
</head>
<body>
<div id="stage"><div id="captions"></div></div>
<script type="module">
  import { makeCaptions, loadTiming } from './src/captions_dom.js';
  import { SCENE_FRAMES, FPS, TOTAL_FRAMES } from './src/captions.js';
  await Promise.all([document.fonts.load('700 40px Montserrat'), document.fonts.load('800 40px Montserrat')]);
  await loadTiming();
  const update = makeCaptions(document.getElementById('captions'));
  window.renderFrame = (f) => { f = Math.max(0, Math.min(TOTAL_FRAMES - 1, Math.round(f))); update(Math.floor(f / SCENE_FRAMES), (f % SCENE_FRAMES) / FPS); };
  window.__ready = true;
</script>
</body>
</html>
